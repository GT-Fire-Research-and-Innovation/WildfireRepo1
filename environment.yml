# Conda environment (no root needed: PACE, RunPod, a desktop). Python 3.12+ is required by geotessera.
#   mamba env create -f environment.yml -p ~/scratch/envs/wildfire
#   source activate ~/scratch/envs/wildfire
#   pip install --index-url https://download.pytorch.org/whl/cu124 torch    # GPU build of PyTorch
name: wildfire
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - geopandas
  - pyogrio
  - shapely>=2
  - rasterio
  - pyproj
  - xarray
  - netcdf4
  - zarr
  - pygrib
  - osmium-tool
  - aria2
  - matplotlib
  - requests
  - huggingface_hub
  - pip
  - pip:
      - geotessera
