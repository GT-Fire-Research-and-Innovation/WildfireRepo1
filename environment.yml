# Conda environment for the raw data grab (no root needed: PACE, a desktop).
#   mamba env create -f environment.yml -p ~/scratch/envs/wildfire-raw
#   export PATH=~/scratch/envs/wildfire-raw/bin:$PATH      (PACE: load only the mamba module)
name: wildfire-raw
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy
  - pandas
  - pyarrow
  - geopandas
  - pyogrio
  - shapely>=2
  - rasterio
  - pyproj
  - netcdf4
  - pygrib
  - h5py
  - pyhdf
  - osmium-tool
  - aria2
  - requests
  - huggingface_hub
  - pytest
  - pip
  - pip:
      - earthengine-api
